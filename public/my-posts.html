<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的发布 - 失物招领平台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <a href="/" class="logo">失物招领</a>
    </div>
  </header>

  <main class="container">
    <h2 class="page-title">我的发布</h2>
    <div id="myPosts" class="post-list"></div>
    <div id="pagination"></div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    let currentPage = 1;
    
    const loadPosts = async () => {
      try {
        const user = await api('/api/user');
        if (!user) {
          Toast.error('请先登录');
          setTimeout(() => location.href = '/login.html', 1000);
          return;
        }
        
        const data = await api(`/api/posts?status=mine&page=${currentPage}&limit=10`);
        const statusMap = { pending: '待审核', approved: '已发布', rejected: '已拒绝', claimed: '已认领', returned: '已归还' };
        
        document.getElementById('myPosts').innerHTML = data.posts.length ? data.posts.map(post => `
          <div class="post-item">
            <div class="post-item-image">
              ${post.images && post.images[0] ? `<img src="${post.images[0]}" alt="">` : '<div class="no-image">无图</div>'}
            </div>
            <div class="post-item-content">
              <div class="post-item-header">
                <span class="type-badge ${post.type}">${post.type === 'lost' ? '寻物' : '招领'}</span>
                <span class="status-badge ${post.status}">${statusMap[post.status]}</span>
              </div>
              <h3><a href="/detail.html?id=${post.id}">${escapeHtml(post.title)}</a></h3>
              <p class="post-item-meta">${post.location || '未知地点'} · ${formatDate(post.created_at)}</p>
            </div>
            <div class="post-item-actions">
              ${post.status === 'pending' ? `<button onclick="deletePost(${post.id})" class="btn btn-sm btn-danger">删除</button>` : ''}
            </div>
          </div>
        `).join('') : '<p class="empty">暂无发布记录</p>';
        
        renderPagination(document.getElementById('pagination'), data, page => { currentPage = page; loadPosts(); });
      } catch (e) {
        Toast.error(e.message);
      }
    };
    
    const deletePost = async id => {
      if (!confirm('确定要删除这条发布吗？')) return;
      try {
        await api('/api/posts/' + id, { method: 'DELETE' });
        Toast.success('删除成功');
        loadPosts();
      } catch (e) {
        Toast.error(e.message);
      }
    };
    
    document.addEventListener('DOMContentLoaded', loadPosts);
  </script>
</body>
</html>
