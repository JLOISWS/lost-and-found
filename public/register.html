<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 失物招领平台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <a href="/" class="logo">失物招领</a>
    </div>
  </header>

  <main class="container auth-page">
    <div class="auth-box">
      <h2>注册</h2>
      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" name="username" required placeholder="请输入用户名">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" name="password" required placeholder="至少6位密码">
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input type="password" name="password2" required placeholder="再次输入密码">
        </div>
        <div class="form-group">
          <label>手机号（选填）</label>
          <input type="tel" name="phone" placeholder="方便联系您">
        </div>
        <button type="submit" class="btn btn-primary btn-block">注册</button>
      </form>
      <p class="auth-link">已有账号？<a href="/login.html">立即登录</a></p>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    const handleRegister = async e => {
      e.preventDefault();
      const form = e.target;
      if (form.password.value !== form.password2.value) {
        return Toast.error('两次密码不一致');
      }
      const data = { username: form.username.value, password: form.password.value, phone: form.phone.value };
      try {
        await api('/api/register', { method: 'POST', body: data });
        Toast.success('注册成功');
        setTimeout(() => location.href = '/', 500);
      } catch (err) {
        Toast.error(err.message);
      }
    };
  </script>
</body>
</html>
